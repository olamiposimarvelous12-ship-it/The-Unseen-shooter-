<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>STAR DEFENDER</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #020611;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
  overflow: hidden;
  touch-action: none;
}

header {
  padding: 12px 4px;
  background: #07152b;
  border-bottom: 2px solid #00eaff;
  box-shadow: 0 0 18px #00eaff55;
}

h1 {
  margin: 0;
  color: #00eaff;
  font-size: 23px;
  letter-spacing: 2px;
  text-shadow: 0 0 12px #00eaff;
}

#stats {
  display: flex;
  justify-content: space-around;
  padding: 10px 2px;
  font-size: 13px;
  font-weight: bold;
}

#stats b { color: #00eaff; }

canvas {
  display: block;
  margin: auto;
  width: 100%;
  max-width: 600px;
  height: calc(100dvh - 190px);
  min-height: 220px;
  max-height: 700px;
  background: #020611;
}

.controls {
  display: flex;
  justify-content: center;
  gap: 9px;
  padding: 8px 4px;
}

button {
  background: #09294a;
  color: white;
  border: 2px solid #00eaff;
  border-radius: 12px;
  padding: 12px 13px;
  font-size: 15px;
  font-weight: bold;
  box-shadow: 0 0 10px #00eaff33;
  touch-action: none;
  user-select: none;
}

button:active {
  background: #00eaff;
  color: #001020;
}

#message {
  position: fixed;
  left: 5%;
  width: 90%;
  top: 35%;
  padding: 18px 10px;
  background: #06162bf2;
  border: 1px solid #00eaff;
  border-radius: 16px;
  box-shadow: 0 0 30px #00eaff44;
}

#message h2 { color: #00eaff; }
#message p { line-height: 1.6; }

#start {
  background: #00eaff;
  color: #001020;
}

.hidden { display: none !important; }
</style>
</head>

<body>

<header>
  <h1>★ STAR DEFENDER ★</h1>
</header>

<div id="stats">
  <span>SCORE: <b id="score">0</b></span>
  <span>LIVES: <b id="lives">3</b></span>
  <span>LEVEL: <b id="level">1</b></span>
</div>

<canvas id="game"></canvas>

<div class="controls">
  <button id="left">◀ LEFT</button>
  <button id="fire">🔥 FIRE</button>
  <button id="right">RIGHT ▶</button>
</div>

<div id="message">
  <h2 id="headline">STAR DEFENDER 🚀</h2>
  <p id="instructions">
    Defend the galaxy!<br>
    Destroy enemies and survive.<br>
    Use the buttons or keyboard arrows and SPACE.
  </p>
  <button id="start">START GAME 🚀</button>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const $ = id => document.getElementById(id);

let W = 600, H = 500, pixelRatio = 1;
let player, bullets, enemies, stars, particles;
let score = 0, lives = 3, level = 1;
let running = false;
let keys = {};
let lastShot = 0, spawnTimer = 0, lastTime = 0;
let animation = 0;

function resize() {
  const rect = canvas.getBoundingClientRect();
  pixelRatio = Math.min(window.devicePixelRatio || 1, 2);
  W = 600;
  H = Math.max(280, rect.height * W / rect.width);

  canvas.width = Math.round(W * pixelRatio);
  canvas.height = Math.round(H * pixelRatio);

  ctx.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
}

function updateStats() {
  $("score").textContent = score;
  $("lives").textContent = lives;
  $("level").textContent = level;
}

function reset() {
  score = 0;
  lives = 3;
  level = 1;
  bullets = [];
  enemies = [];
  particles = [];
  keys = {};
  spawnTimer = 0;
  lastShot = 0;

  player = {
    x: W / 2,
    y: H - 48,
    speed: 320
  };

  stars = Array.from({length: 110}, () => ({
    x: Math.random() * W,
    y: Math.random() * H,
    size: Math.random() * 2 + 0.4,
    speed: Math.random() * 55 + 20
  }));

  updateStats();
  $("headline").textContent = "STAR DEFENDER 🚀";
  $("instructions").innerHTML =
    "Defend the galaxy!<br>Destroy enemies and survive!";
  $("start").textContent = "RESTART GAME 🚀";
  $("message").classList.add("hidden");

  running = true;
  lastTime = performance.now();
  cancelAnimationFrame(animation);
  animation = requestAnimationFrame(loop);
}

function shoot() {
  const now = performance.now();
  if (!running || now - lastShot < 190) return;

  lastShot = now;

  bullets.push({
    x: player.x,
    y: player.y - 20,
    speed: 540
  });
}

function makeExplosion(x, y, color, amount = 18) {
  for (let i = 0; i < amount; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 230;

    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0.35 + Math.random() * 0.55,
      maxLife: 0.9,
      size: 2 + Math.random() * 4,
      color
    });
  }
}

function addEnemy() {
  const size = 16 + Math.random() * 12;

  enemies.push({
    x: size + Math.random() * (W - size * 2),
    y: -size,
    size,
    speed: 65 + level * 13 + Math.random() * 45,
    phase: Math.random() * 6,
    phaseSpeed: 1 + Math.random() * 2
  });
}

function drawStars(dt) {
  ctx.fillStyle = "#020611";
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    s.y += s.speed * dt;

    if (s.y > H) {
      s.y = 0;
      s.x = Math.random() * W;
    }

    ctx.globalAlpha = 0.35 + s.size / 3;
    ctx.fillStyle = "#bcecff";
    ctx.fillRect(s.x, s.y, s.size, s.size);

    if (s.size > 1.7) {
      ctx.shadowBlur = 8;
      ctx.shadowColor = "#00eaff";
      ctx.fillRect(s.x, s.y, s.size, s.size);
      ctx.shadowBlur = 0;
    }
  }

  ctx.globalAlpha = 1;
}

function drawShip(now) {
  ctx.save();
  ctx.translate(player.x, player.y);

  // Animated engine flames
  const flameLength = 12 + Math.random() * 13;

  ctx.shadowBlur = 16;
  ctx.shadowColor = "#ff7b00";

  const flame = ctx.createLinearGradient(0, 8, 0, flameLength + 12);
  flame.addColorStop(0, "#ffffff");
  flame.addColorStop(0.35, "#00eaff");
  flame.addColorStop(1, "#1764ff");

  ctx.fillStyle = flame;
  ctx.beginPath();
  ctx.moveTo(-7, 7);
  ctx.lineTo(0, flameLength + 12);
  ctx.lineTo(7, 7);
  ctx.closePath();
  ctx.fill();

  // Spaceship body
  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00eaff";
  ctx.fillStyle = "#00dfff";

  ctx.beginPath();
  ctx.moveTo(0, -22);
  ctx.lineTo(19, 12);
  ctx.lineTo(6, 8);
  ctx.lineTo(0, 14);
  ctx.lineTo(-6, 8);
  ctx.lineTo(-19, 12);
  ctx.closePath();
  ctx.fill();

  // Cockpit
  ctx.shadowColor = "#ffffff";
  ctx.fillStyle = "#ffffff";
  ctx.beginPath();
  ctx.ellipse(0, -4, 4, 9, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawEnemy(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  ctx.rotate(e.phase);

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#ff2255";
  ctx.fillStyle = "#ff245b";

  ctx.beginPath();

  for (let i = 0; i < 10; i++) {
    const angle = i * Math.PI / 5;
    const radius = i % 2 ? e.size * 0.4 : e.size * 0.65;

    if (i === 0) {
      ctx.moveTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
    } else {
      ctx.lineTo(Math.cos(angle) * radius, Math.sin(angle) * radius);
    }
  }

  ctx.closePath();
  ctx.fill();

  ctx.shadowBlur = 0;
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(-5, -3, 3, 3);
  ctx.fillRect(3, -3, 3, 3);

  ctx.restore();
}

function drawLaser(b) {
  ctx.save();

  ctx.shadowBlur = 18;
  ctx.shadowColor = "#00ffff";
  ctx.strokeStyle = "#00ffff";
  ctx.lineWidth = 5;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(b.x, b.y + 9);
  ctx.lineTo(b.x, b.y - 12);
  ctx.stroke();

  ctx.shadowBlur = 4;
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 2;

  ctx.beginPath();
  ctx.moveTo(b.x, b.y + 7);
  ctx.lineTo(b.x, b.y - 10);
  ctx.stroke();

  ctx.restore();
}

function hit(a, b, radius) {
  return Math.hypot(a.x - b.x, a.y - b.y) < radius;
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.97;
    p.vy *= 0.97;
    p.life -= dt;

    if (p.life <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 12;
    ctx.shadowColor = p.color;

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function loop(now) {
  if (!running) return;

  const dt = Math.min((now - lastTime) / 1000, 0.035);
  lastTime = now;

  drawStars(dt);

  let movement = 0;
  if (keys.left) movement--;
  if (keys.right) movement++;

  player.x += movement * player.speed * dt;
  player.x = Math.max(22, Math.min(W - 22, player.x));

  if (keys.fire || keys.space) shoot();

  drawShip(now);

  // Update and draw lasers
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.y -= b.speed * dt;

    drawLaser(b);

    if (b.y < -20) bullets.splice(i, 1);
  }

  // Enemy waves
  spawnTimer += dt;

  if (spawnTimer > Math.max(0.32, 1.0 - level * 0.055)) {
    spawnTimer = 0;
    addEnemy();
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    e.y += e.speed * dt;
    e.phase += e.phaseSpeed * dt;
    e.x += Math.sin(now / 450 + e.phase) * 32 * dt;

    let destroyed = false;

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (hit(e, bullets[j], e.size * 0.8)) {
        makeExplosion(e.x, e.y, "#ff3264", 22);

        enemies.splice(i, 1);
        bullets.splice(j, 1);

        score += 10;
        level = 1 + Math.floor(score / 150);
        updateStats();

        destroyed = true;
        break;
      }
    }

    if (destroyed) continue;

    drawEnemy(e);

    if (hit(e, player, e.size + 12) || e.y > H + e.size) {
      makeExplosion(e.x, e.y, "#ff8800", 14);
      enemies.splice(i, 1);

      lives--;
      updateStats();

      if (lives <= 0) {
        endGame();
        return;
      }
    }
  }

  updateParticles(dt);

  ctx.save();
  ctx.fillStyle = "#00eaff";
  ctx.font = "bold 13px Arial";
  ctx.shadowBlur = 8;
  ctx.shadowColor = "#00eaff";
  ctx.fillText("GALACTIC DEFENCE", 12, 22);
  ctx.restore();

  animation = requestAnimationFrame(loop);
}

function endGame() {
  running = false;

  $("headline").textContent = "GAME OVER!";
  $("instructions").innerHTML =
    "Final score: <b>" + score +
    "</b><br>You reached level " + level +
    ". Ready for another mission?";

  $("start").textContent = "PLAY AGAIN 🚀";
  $("message").classList.remove("hidden");
}

function bindButton(id, key) {
  const button = $(id);

  const down = event => {
    event.preventDefault();
    keys[key] = true;

    if (key === "fire") shoot();
  };

  const up = event => {
    event.preventDefault();
    keys[key] = false;
  };

  button.addEventListener("pointerdown", down);
  button.addEventListener("pointerup", up);
  button.addEventListener("pointercancel", up);
  button.addEventListener("pointerleave", up);
}

bindButton("left", "left");
bindButton("right", "right");
bindButton("fire", "fire");

document.addEventListener("keydown", event => {
  if (["ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
    event.preventDefault();
  }

  if (event.code === "ArrowLeft") keys.left = true;
  if (event.code === "ArrowRight") keys.right = true;
  if (event.code === "Space") keys.space = true;
});

document.addEventListener("keyup", event => {
